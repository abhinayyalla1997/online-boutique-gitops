# ============================================================
# values.yaml — GitOps repo defaults
#
# 11 of 12 services enabled (2026-09-20) — CI/CD matrix now builds, scans,
# and signs every service; all 12 have real images in ECR at commit
# f2b66d9f1d6996b5bbcbf06b90dfa69bd040acb6. Bootstrap tags below are
# pinned to that commit. From here on, Argo CD Image Updater overwrites
# each service's image.tag whenever a newer <service>-<sha> tag lands in
# ECR — do not hand-edit these tags afterwards.
#
# NOT enabled, deliberately:
# - shoppingassistantservice: its source calls Google Cloud AlloyDB,
#   Secret Manager, and the Gemini API at module import time — this is
#   an AWS-only project, so that GCP infrastructure doesn't exist here.
#   The container would crash immediately on startup. CI/CD still
#   builds/scans/signs it fine; only cluster deployment is out of scope.
#   See the field comment below.
# - networkPolicy: 6 of 12 enabled services (currencyservice,
#   shippingservice, adservice, loadgenerator, redis-cart, and formerly
#   shoppingassistantservice) have no explicit NetworkPolicy in
#   templates/networkpolicy.yaml despite being legitimate traffic
#   targets/sources per its own documented call graph. With
#   default-deny-all in effect, enabling this as-is would silently break
#   several service-to-service paths. Needs those policies added and
#   audited before enabling.
# - ingress: no ingress-nginx controller in the cluster yet — reachability
#   is via frontend's NodePort Service (see templates/frontend.yaml),
#   port 30000 on any worker node's public IP.
# ============================================================

global:
  namespace: boutique
  imageRegistry: "566279697030.dkr.ecr.us-east-1.amazonaws.com"
  imageRepository: "online-boutique"
  imageTag: "unused" # every enabled service below sets its own image.tag
  imagePullPolicy: Always

secrets:
  googleApiKey: "placeholder-replace-in-prod"
  paymentGatewayApiKey: "placeholder"

frontend:
  enabled: true
  replicaCount: 2
  image:
    name: frontend
    useGlobal: true
    tag: "frontend-f2b66d9f1d6996b5bbcbf06b90dfa69bd040acb6"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

