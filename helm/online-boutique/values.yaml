  # Google Cloud AlloyDB, Secret Manager, and the Gemini API at module
  # import time, before Flask even starts. This is an AWS-only project;
  # none of that GCP infrastructure exists or is in scope to add. The
  # container would crash immediately on startup regardless of health
  # probe config. CI/CD still builds/scans/signs it fine (see cd.yml) —
  # only cluster deployment is out of scope.
  enabled: false
  replicaCount: 1
  image:
    name: shoppingassistantservice
    useGlobal: true
    tag: "shoppingassistantservice-f2b66d9f1d6996b5bbcbf06b90dfa69bd040acb6"
