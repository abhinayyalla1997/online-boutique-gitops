# No ingress-nginx controller in the cluster yet — reachability for now is
# via frontend's NodePort Service (see templates/frontend.yaml), port 30000
# on any worker node's public IP. Revisit once an ingress controller exists.
ingress:
  enabled: false
  className: nginx
  host: boutique.example.com
  tls:
    enabled: false

# Off for now — hpa.yaml hardcodes HPA objects for services not yet
# deployed (cartservice, checkoutservice, productcatalogservice); enabling
# this before those services exist just produces harmless but noisy
# "unable to fetch metrics" warnings.
hpa:
  enabled: false

networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false
