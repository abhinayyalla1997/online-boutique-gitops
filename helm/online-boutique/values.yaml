# ============================================================
# values.yaml — GitOps repo defaults
#
# SCOPE (2026-09-19): only `frontend` is enabled. This is deliberate —
# we're validating the full CI -> ECR -> Argo CD Image Updater -> Argo CD
# -> cluster pipeline end to end with one service before expanding to the
# other 11. Flip a service's `enabled` to `true` (and give it an
# `image.tag`) to bring it online; the chart/templates already support all
# 12, nothing structural needs to change.
#
# frontend.image.tag starts pinned to the first real CD build's Git SHA
# tag. From here on, Argo CD Image Updater overwrites this value whenever
# a new frontend-<sha> tag lands in ECR — do not hand-edit it afterwards.
# ============================================================

global:
  namespace: boutique
  imageRegistry: "566279697030.dkr.ecr.us-east-1.amazonaws.com"
  imageRepository: "online-boutique"
  imageTag: "unused" # every enabled service below sets its own image.tag
  imagePullPolicy: Always

secrets:
  googleApiKey: "placeholder-replace-in-prod"
  paymentGatewayApiKey: "placeholder"

frontend:
  enabled: true
  replicaCount: 2
  image:
    name: frontend
    useGlobal: true
    tag: "frontend-17558cec861b5017ffbdddac1d728d450364bf4c" # bootstrap value — see note above; full tag, matches _helpers.tpl
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

cartservice:
  enabled: false
  replicaCount: 2
  image:
    name: cartservice
    useGlobal: true
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

