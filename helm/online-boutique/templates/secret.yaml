# ============================================================
# Secrets — sensitive configuration only
# In real prod: use AWS Secrets Manager + External Secrets Operator
# OR Sealed Secrets (encrypted in git)
# Never commit real secret values to git
#
# For this project: placeholder values
# Replace with real values via:
#   helm install --set secrets.googleApiKey=REAL_VALUE
# OR inject via ArgoCD vault plugin
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: boutique-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "online-boutique.labels" . | nindent 4 }}
  annotations:
    # Document where real secrets come from in prod
    secret-source: "aws-secrets-manager"
    secret-path: "prod/online-boutique"
type: Opaque
stringData:
  # Google AI API key — used by shoppingassistantservice
  # In prod: pull from AWS Secrets Manager
  GOOGLE_API_KEY: {{ .Values.secrets.googleApiKey | default "placeholder-replace-in-prod" | quote }}

  # If you add a real payment gateway later
  PAYMENT_GATEWAY_API_KEY: {{ .Values.secrets.paymentGatewayApiKey | default "placeholder" | quote }}
