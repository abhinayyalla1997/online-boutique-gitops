# ============================================================
# Product Catalog Service — Go
# Serves product listings from embedded JSON file
# gRPC on port 3550
# Called by: frontend, checkoutservice, recommendationservice
# High read traffic — 2 replicas
# ============================================================
{{- if .Values.productcatalogservice.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  namespace: {{ .Values.global.namespace }}
  labels:
    app: productcatalogservice
    {{- include "online-boutique.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.productcatalogservice.replicaCount }}
  selector:
    matchLabels:
      app: productcatalogservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: productcatalogservice
        version: v1
    spec:
      serviceAccountName: productcatalogservice-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - productcatalogservice
                topologyKey: kubernetes.io/hostname
      containers:
        - name: productcatalogservice
          image: {{ include "online-boutique.image" (dict "service" .Values.productcatalogservice "global" .Values.global) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: grpc
              containerPort: 3550
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: PORT_PRODUCT
            - name: DISABLE_PROFILER
              valueFrom:
                configMapKeyRef:
                  name: boutique-config
                  key: DISABLE_PROFILER
          resources:
            {{- toYaml .Values.productcatalogservice.resources | nindent 12 }}
          livenessProbe:
            grpc:
              port: 3550
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 3550
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  namespace: {{ .Values.global.namespace }}
  labels:
    app: productcatalogservice
    {{- include "online-boutique.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: productcatalogservice
  ports:
    - name: grpc
      port: 3550
      targetPort: 3550
      protocol: TCP
{{- end }}
